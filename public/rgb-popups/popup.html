<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RGB Popup</title>
    <style>
      html, body, canvas { height: 100%; margin: 0; overflow: hidden; width: 100%; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="composition"></canvas>
    <script>
      const channel = window.location.pathname.split('/').pop();
      const config = {
        r: { name: 'rgb-red', color: '#ff0000', title: 'R' },
        g: { name: 'rgb-green', color: '#00ff00', title: 'G' },
        b: { name: 'rgb-blue', color: '#0000ff', title: 'B' },
      }[channel] || { name: 'rgb-red', color: '#ff0000', title: 'R' };

      document.title = config.title;

      const canvas = document.querySelector('#composition');
      const context = canvas.getContext('2d');

      const renderComposition = (layers = []) => {
        const scale = window.devicePixelRatio || 1;
        const width = Math.round(window.innerWidth * scale);
        const height = Math.round(window.innerHeight * scale);

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          canvas.style.width = `${window.innerWidth}px`;
          canvas.style.height = `${window.innerHeight}px`;
        }

        context.setTransform(scale, 0, 0, scale, 0, 0);
        context.fillStyle = config.color;
        context.fillRect(0, 0, window.innerWidth, window.innerHeight);

        layers.forEach(({ x, y, width, height, color }) => {
          context.fillStyle = color;
          context.fillRect(x, y, width, height);
        });
      };

      const reportBounds = () => {
        const sideFrame = Math.max(0, (window.outerWidth - window.innerWidth) / 2);
        const topFrame = Math.max(0, window.outerHeight - window.innerHeight - sideFrame);

        window.opener?.postMessage({
          type: 'popup-bounds',
          name: config.name,
          bounds: {
            left: window.screenX + sideFrame,
            top: window.screenY + topFrame,
            right: window.screenX + window.outerWidth - sideFrame,
            bottom: window.screenY + window.outerHeight - sideFrame,
          },
        }, window.location.origin);

        window.requestAnimationFrame(reportBounds);
      };

      window.addEventListener('message', ({ data, origin }) => {
        if (origin !== window.location.origin) return;
        if (data?.type === 'popup-composition' && data.name === config.name) {
          renderComposition(data.layers);
        }
      });

      window.addEventListener('resize', () => renderComposition());
      window.addEventListener('focus', reportBounds);
      renderComposition();
      reportBounds();
    </script>
  </body>
</html>
