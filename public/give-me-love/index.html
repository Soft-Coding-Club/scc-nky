<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>give me love</title>
  <style>
    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      color: #111;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    #hearts {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      line-height: 1;
      will-change: transform;
    }

    main { position: relative; z-index: 1; text-align: center; }
    h1 { margin: 0 0 18px; font: inherit; font-size: 1rem; font-weight: 400; }

    .info-toggle {
      position: fixed;
      z-index: 2;
      top: 20px;
      right: 20px;
    }

    .project-info {
      position: fixed;
      z-index: 3;
      top: 52px;
      right: 20px;
      width: min(270px, calc(100vw - 40px));
      font-size: 11px;
      line-height: 1.55;
    }

    .project-info h2 { margin: 0 0 8px; font: inherit; font-weight: 700; }
    .project-info p { margin: 0 0 8px; }
    .project-info p:last-child { margin-bottom: 0; }
    @media (max-width: 600px) {
      .info-toggle { top: 14px; right: 14px; }
      .project-info { top: 46px; right: 14px; width: 205px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="hearts" aria-hidden="true"></div>
  <button class="info-toggle" type="button" aria-label="프로젝트 정보 열기" aria-expanded="false" aria-controls="project-info">ⓘ</button>
  <aside id="project-info" class="project-info" hidden>
    <h2>project information</h2>
    <p>type a heart shape across your keyboard, then press enter.</p>
    <p>the page maps each key to its keyboard position and compares your input with a few heart-shaped patterns.</p>
  </aside>
  <main>
    <h1>give me love (and press enter)</h1>
    <input id="keyboard" type="text" autocomplete="off" aria-label="heart input" autofocus>
  </main>

  <script>
    const input = document.getElementById('keyboard');
    const heartsContainer = document.getElementById('hearts');
    const infoToggle = document.querySelector('.info-toggle');
    const projectInfo = document.getElementById('project-info');
    const keyMap = {};
    let pressedKeys = [];

    function closeInfo() {
      projectInfo.hidden = true;
      infoToggle.setAttribute('aria-expanded', 'false');
      infoToggle.setAttribute('aria-label', '프로젝트 정보 열기');
      infoToggle.textContent = 'ⓘ';
      input.focus();
    }

    infoToggle.addEventListener('click', () => {
      const willOpen = projectInfo.hidden;
      if (!willOpen) return closeInfo();
      projectInfo.hidden = false;
      infoToggle.setAttribute('aria-expanded', 'true');
      infoToggle.setAttribute('aria-label', '프로젝트 정보 닫기');
      infoToggle.textContent = '×';
    });

    const keyboardLayout = [
      ['Escape', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12'],
      ['Backquote', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0', 'Minus', 'Equal', 'Backspace'],
      ['Tab', 'KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP', 'BracketLeft', 'BracketRight', 'Backslash'],
      ['CapsLock', 'KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon', 'Quote', 'Enter'],
      ['ShiftLeft', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Comma', 'Period', 'Slash', 'ShiftRight']
    ];

    keyboardLayout.forEach((row, rowIndex) => row.forEach((key, colIndex) => {
      keyMap[key] = { row: rowIndex, col: colIndex };
    }));

    const heartShapes = [
      new Set(['0,1', '0,2', '1,0', '1,3', '2,0', '2,3', '3,1', '3,2']),
      new Set(['0,1', '0,2', '1,0', '1,3', '2,1', '2,2', '3,1']),
      new Set(['0,0', '0,2', '1,1', '2,0', '2,2', '3,1']),
      new Set(['0,1', '0,3', '1,0', '1,4', '2,1', '2,3', '3,2'])
    ];

    function reset() {
      pressedKeys = [];
      input.value = '';
    }

    function hasHeart() {
      if (pressedKeys.length < 6) return false;
      const coordinates = pressedKeys.map(key => keyMap[key]).filter(Boolean);
      if (!coordinates.length) return false;

      const minRow = Math.min(...coordinates.map(point => point.row));
      const minCol = Math.min(...coordinates.map(point => point.col));
      const shape = new Set(coordinates.map(point => `${point.row - minRow},${point.col - minCol}`));

      return heartShapes.some(heart => {
        let matches = 0;
        shape.forEach(point => { if (heart.has(point)) matches++; });
        return matches >= heart.size * .8 && shape.size >= heart.size * .8;
      });
    }

    document.addEventListener('keydown', event => {
      if (event.target !== input) return;
      if (event.code === 'Enter') {
        event.preventDefault();
        if (hasHeart()) {
          alert('love received ♥');
        } else {
          const noLoveMessages = [
            'give me real love',
            'i want real love, not just a word',
            'that is not a heart',
            'try again. make it mean something.'
          ];
          alert(noLoveMessages[Math.floor(Math.random() * noLoveMessages.length)]);
        }
        reset();
        return;
      }
      if (event.code === 'Escape') return reset();
      if (!event.repeat) pressedKeys.push(event.code);
    });

    const hearts = [];
    let ticks = 0;

    function addHeart() {
      const element = document.createElement('span');
      const size = Math.random() > .6 ? 20 : 15;
      element.className = 'heart';
      element.textContent = '❤️';
      element.style.fontSize = `${size}px`;
      heartsContainer.appendChild(element);
      hearts.push({ element, x: Math.floor(Math.random() * innerWidth), y: innerHeight + 24, speed: 5 + Math.floor(Math.random() * 7) });
    }

    function tick() {
      if (ticks++ % 5 === 0) addHeart();
      hearts.forEach(heart => {
        heart.y -= heart.speed;
        heart.element.style.transform = `translate(${heart.x}px, ${heart.y}px)`;
      });
      while (hearts[0] && hearts[0].y < -40) hearts.shift().element.remove();
    }

    tick();
    setInterval(tick, 200);
  </script>
</body>
</html>
