<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 Not Found</title>
<style>
  /* ─────────────────────────────────────────────
     1) The 404 page — rendered exactly like a bare
        nginx error page in Safari (980px layout,
        Times, UA-default h1 / hr), scaled to fit.
     ───────────────────────────────────────────── */
  html { color-scheme: light; background: #fff; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: #fff; touch-action: manipulation; }

  .nginx-clip { overflow: hidden; }
  .nginx {
    display: flow-root;              /* keep h1 margin inside the scaled box */
    width: 980px;
    padding: 0 8px 8px;              /* UA body margin, top collapses into h1 */
    box-sizing: border-box;
    transform-origin: 0 0;
    font: 16px Times, "Times New Roman", serif;
    color: #000;
  }
  .nginx h1 { font-size: 2em; margin: 0.67em 0; font-weight: bold; }

  @keyframes buzz {
    0%, 100% { translate: 0 0; }
    20% { translate: -2px 0; } 40% { translate: 2px 0; }
    60% { translate: -1.5px 0; } 80% { translate: 1.5px 0; }
  }
  .nginx-clip.buzz { animation: buzz 90ms linear 6; }

  /* ─────────────────────────────────────────────
     2) iOS notification banners
     ───────────────────────────────────────────── */
  :root {
    --font: system-ui, -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    --glass: rgba(246, 246, 248, 0.74);
    --glass-solid: #f4f4f6;
    --label: #000;
    --secondary: rgba(60, 60, 67, 0.6);
    --platter-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.9),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.45),
      0 0 0 0.5px rgba(0, 0, 0, 0.06),
      0 6px 16px -4px rgba(0, 0, 0, 0.10),
      0 18px 40px -12px rgba(0, 0, 0, 0.16);
    --spring: cubic-bezier(0.2, 0.95, 0.3, 1.04);
    --spring-soft: cubic-bezier(0.25, 0.9, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --glass: rgba(44, 44, 46, 0.80);
      --glass-solid: #2c2c2e;
      --label: #fff;
      --secondary: rgba(235, 235, 245, 0.6);
      --platter-shadow:
        inset 0 0.5px 0 rgba(255, 255, 255, 0.16),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.08),
        0 6px 16px -4px rgba(0, 0, 0, 0.22),
        0 18px 40px -12px rgba(0, 0, 0, 0.34);
    }
  }

  .banner-layer {
    position: fixed;
    inset: 0 auto auto 0;
    width: 100%;
    height: 100%;
    margin: 0; padding: 0; border: 0;
    background: transparent;
    color: inherit;
    overflow: visible;
    pointer-events: none;
    transform-origin: 0 0;
    z-index: 2147483000;
  }

  .stack {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: 0; right: 0;
    height: 0;
  }

  .banner {
    --d: 0;
    position: absolute;
    top: 0; left: 0; right: 0;
    width: min(100% - 16px, 410px);
    margin: 0 auto;
    transform-origin: 50% 100%;
    transform: translate3d(0, calc(var(--d) * 9px), 0) scale(calc(1 - var(--d) * 0.05));
    z-index: calc(10 - var(--d));
    transition: transform 560ms var(--spring-soft), opacity 260ms ease;
  }
  .banner[data-depth="3"] { opacity: 0; }

  .platter {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 64px;
    padding: 12px 14px 12px 12px;
    box-sizing: border-box;
    border-radius: 24px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(1.9);
    backdrop-filter: blur(30px) saturate(1.9);
    box-shadow: var(--platter-shadow);
    color: var(--label);
    font-family: var(--font);
    overflow: hidden;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    cursor: default;
    outline: none;
  }
  .platter:focus-visible { box-shadow: var(--platter-shadow), 0 0 0 3px rgba(0, 122, 255, 0.55); }
  .banner:not([data-depth="0"]) .platter { height: var(--front-h, 64px); pointer-events: none; }

  .n-content { display: contents; }
  .n-lead, .n-text { transition: opacity 200ms ease; }
  .banner:not([data-depth="0"]) .n-lead,
  .banner:not([data-depth="0"]) .n-text { opacity: 0; }

  /* App icon (non-communication) — 38pt continuous-corner squircle */
  .n-lead { position: relative; flex: none; width: 38px; height: 38px; }
  .app-icon {
    width: 38px; height: 38px;
    border-radius: 8.6px;
    display: grid; place-items: center;
    overflow: hidden;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.08);
  }
  .app-icon svg { width: 100%; height: 100%; display: block; }

  /* Communication notification — contact avatar + app badge */
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: #fff;
    font: 600 16px/1 var(--font);
    letter-spacing: -0.3px;
    overflow: hidden;
  }
  .avatar.emoji { font-size: 20px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute;
    right: -3px; bottom: -3px;
    width: 17px; height: 17px;
    border-radius: 4.4px;
    overflow: hidden;
    box-shadow: 0 0 0 1.5px var(--glass-solid);
  }
  .badge svg { width: 100%; height: 100%; display: block; }

  .n-text { flex: 1; min-width: 0; }
  .n-head { display: flex; align-items: baseline; gap: 8px; }
  .n-title {
    flex: 1; min-width: 0;
    font: 600 15px/20px var(--font);
    letter-spacing: -0.24px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .n-time {
    flex: none;
    font: 400 13px/18px var(--font);
    letter-spacing: -0.08px;
    color: var(--secondary);
  }
  .n-body {
    margin: 0;
    font: 400 15px/20px var(--font);
    letter-spacing: -0.24px;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    line-clamp: 4;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .n-summary {
    display: inline-block;
    width: 13px; height: 13px;
    margin-right: 3px;
    vertical-align: -1px;
    color: var(--secondary);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .haptic { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

  /* ─────────────────────────────────────────────
     3) Hidden remote (triple-tap the page, or #ctl)
     ───────────────────────────────────────────── */
  .sheet {
    position: fixed;
    inset: auto 0 calc(env(safe-area-inset-bottom, 0px) + 8px) 0;
    width: min(100% - 16px, 420px);
    max-height: 80dvh;
    margin: 0 auto;
    padding: 8px 16px 18px;
    box-sizing: border-box;
    border: 0;
    border-radius: 30px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(1.9);
    backdrop-filter: blur(30px) saturate(1.9);
    box-shadow: var(--platter-shadow);
    color: var(--label);
    font-family: var(--font);
    overflow: auto;
  }
  .sheet::backdrop { background: rgba(0, 0, 0, 0.18); }
  .sheet[open] { animation: sheet-in 420ms var(--spring); }
  @keyframes sheet-in { from { transform: translateY(110%); } }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: rgba(127, 127, 127, 0.4); margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .sheet-head h2 { margin: 0; font: 700 17px/22px var(--font); letter-spacing: -0.4px; outline: none; }
  .sheet-done { appearance: none; border: 0; background: none; color: #007aff; font: 600 17px var(--font); padding: 6px 2px; cursor: pointer; }
  .sheet-sub { margin: 0 0 14px; font: 400 13px/18px var(--font); color: var(--secondary); }
  .sheet-sub b { font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; margin-bottom: 16px; }
  .tile {
    appearance: none; border: 0; background: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    color: var(--label); font: 500 11px/13px var(--font); letter-spacing: -0.1px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tile .app-icon { width: 54px; height: 54px; border-radius: 12.2px; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.08); }
  .tile .app-icon.glyph { background: rgba(127, 127, 127, 0.16); font-size: 26px; }
  .tile:active .app-icon { transform: scale(0.92); filter: brightness(0.92); }
  .tile .app-icon { transition: transform 120ms ease; }
  .rows { border-radius: 12px; background: rgba(127, 127, 127, 0.1); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; font: 400 15px/20px var(--font); }
  .row + .row { border-top: 0.5px solid rgba(127, 127, 127, 0.25); }
  .row input { accent-color: #34c759; width: 20px; height: 20px; margin: 0; }
  .sheet-foot { margin: 12px 4px 0; font: 400 12px/16px var(--font); color: var(--secondary); }

  @media (prefers-reduced-motion: reduce) {
    .banner, .n-lead, .n-text { transition-duration: 1ms; }
    .sheet[open] { animation: none; }
    .nginx-clip.buzz { animation: none; }
  }
</style>
</head>
<body>

<div class="nginx-clip" id="nginx-clip">
  <div class="nginx" id="nginx">
<center><h1>404 Not Found</h1></center>
<hr><center>nginx</center>
  </div>
</div>

<div class="banner-layer" id="banner-layer" popover="manual">
  <div class="stack" id="stack"></div>
</div>

<div class="sr-only" id="sr-live" aria-live="assertive" aria-atomic="true"></div>
<label class="haptic" id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<dialog class="sheet" id="remote" aria-labelledby="remote-title">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="remote-title" tabindex="-1" autofocus>알림 리모컨</h2>
    <button type="button" class="sheet-done" id="remote-done">완료</button>
  </div>
  <p class="sheet-sub" id="remote-audio">소리 꺼짐 · 화면을 한 번 탭하면 켜져요</p>
  <div class="tiles" id="tiles"></div>
  <div class="rows">
    <label class="row">자동 알림 <input type="checkbox" switch id="auto-toggle" checked></label>
    <label class="row">소리 <input type="checkbox" switch id="sound-toggle" checked></label>
  </div>
  <p class="sheet-foot">빈 화면을 세 번 연속 탭하거나 주소 끝에 #ctl 을 붙이면 이 리모컨이 열려요.</p>
</dialog>

  const DECODED = new WeakMap();
  function loadClips(c) {
    if (DECODED.has(c)) return DECODED.get(c).ready;
    const entry = { buffers: {}, ready: null };
    DECODED.set(c, entry);
    entry.ready = Promise.all(Object.entries(CLIPS).map(([name, uri]) => {
      const bin = atob(uri.split(",")[1]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Promise((res) => {
        try {
          const p = c.decodeAudioData(bytes.buffer, (buf) => { entry.buffers[name] = trimLead(buf); res(); }, () => res());
          if (p && p.catch) p.catch(() => res());
        } catch (_) { res(); }
      });
    }));
    return entry.ready;

  function trimLead(buf) {
    const d = buf.getChannelData(0);
    let i = 0;
    while (i < d.length && Math.abs(d[i]) < 0.008) i++;
    buf._offset = Math.max(0, i - 40) / buf.sampleRate;
    return buf;
  }

        s.gain.value = send;
        g.connect(s).connect(chain.verbIn);

      param.setValueAtTime(0.0001, t);
      param.exponentialRampToValueAtTime(peak, t + attack);
      param.exponentialRampToValueAtTime(0.0001, t + dur);

      const o = c.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      o.start(t);
      o.stop(stop);
      return o;

      samples: DECODED.get(c)?.buffers || {},
      // Recorded clip playback
      sample(t, buf, { gain = 1, rate = 1, send = 0.1 } = {}) {
        const src = c.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = rate;

      bell(t, f, { dur = 0.8, gain = 0.25, ratio = 3.5, index = 1.2, decay = 0.2, attack = 0.003, send = 0.25 } = {}) {

        parts.forEach(([mul, amp, d]) => {
          const o = sine(f * mul, t, t + d + 0.03);

          env(g.gain, t, gain * amp, 0.002, d);
          o.connect(g).connect(out);

        freqs.forEach((f, i) => {

    list.forEach((b, i) => {
      const depth = list.length - 1 - i;
      b.style.setProperty("--d", Math.min(depth, 3));
      b.dataset.depth = String(Math.min(depth, 3));
      b.querySelector(".platter").tabIndex = depth === 0 ? 0 : -1;
      if (depth >= 3) {
        b.dataset.leaving = "1";
        setTimeout(() => b.remove(), 320);
      }
    });
    const front = frontPlatter();
    if (front) stack.style.setProperty("--front-h", `${front.offsetHeight}px`);
  }

  // Stack-wide auto dismiss (iOS clears the whole stack together)
  let stackTimer = 0;
  let stackDuration = 5200;
  let holding = false;
  function armTimer(ms = stackDuration) {
    clearTimeout(stackTimer);
    if (holding) return;
    stackTimer = setTimeout(() => dismissAll("timeout"), ms);
  }

  let dismissing = null;
  function dismissAll(mode) {
    if (dismissing) return dismissing;
    const items = [...stack.children];
    if (!items.length) return Promise.resolve();
    clearTimeout(stackTimer);
    const from = stack.style.transform || "translateY(0px)";
    const h = (frontPlatter()?.offsetHeight || 80) + 60;
    let anim;
    if (reduceMotion.matches) {
      anim = stack.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150 });
    } else if (mode === "open") {
      anim = stack.animate(
        [{ transform: from, opacity: 1 }, { transform: "translateY(0) scale(0.92)", opacity: 0 }],
        { duration: 230, easing: "cubic-bezier(0.3, 0, 0.2, 1)" }
      );
    } else {
      anim = stack.animate(
        [{ transform: from }, { transform: `translateY(${-h}px)` }],
        mode === "swipe"
          ? { duration: 240, easing: "cubic-bezier(0.15, 0.55, 0.35, 1)" }
          : { duration: 360, easing: "cubic-bezier(0.45, 0, 0.6, 0.9)" }
      );
    }
    dismissing = anim.finished.catch(() => {}).then(() => {
      items.forEach((b) => b.remove());
      stack.style.transform = "";
      anim.cancel();
      dismissing = null;
    });
    return dismissing;
  }

  function announce(text) {
    live.textContent = "";
    setTimeout(() => { live.textContent = text; }, 40);
  }

  const buzzEl = $("nginx-clip");
  async function notify(item) {
    if (dismissing) await dismissing;
    const app = APPS[item.app] || APPS.ios;

    Sound.play(item.app);
    haptic(item.app);
    if (item.app === "emergency") {
      buzzEl.classList.remove("buzz");
      void buzzEl.offsetWidth;
      buzzEl.classList.add("buzz");
    }

    const el = buildBanner(item, app);
    stack.appendChild(el);
    layoutStack();

    const platter = el.querySelector(".platter");
    if (!reduceMotion.matches) {
      platter.animate(
        [{ transform: "translateY(calc(-100% - 24px))" }, { transform: "translateY(0)" }],
        { duration: 640, easing: SPRING_DROP }
      );
      platter.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease-out" });
    }

    stackDuration = Math.max(app.duration, item.app === "emergency" ? 9000 : 0);
    armTimer();
    announce(`${app.name}, ${item.title}: ${item.body}`);

    if (item.followUp) setTimeout(() => notify(item.followUp), item.followUp.delay || 1400);
  }

  // ── Gestures: swipe up to dismiss, pull down rubber-bands, tap to "open"
  let drag = null;
  stack.addEventListener("pointerdown", (e) => {
    const front = frontPlatter();
    if (!front || !front.contains(e.target) || dismissing) return;
    drag = { id: e.pointerId, y0: e.clientY, t0: performance.now(), dy: 0, moved: false, vy: 0, ly: e.clientY, lt: performance.now() };
    try { front.setPointerCapture(e.pointerId); } catch (_) {}
    holding = true;
    clearTimeout(stackTimer);
  });
  stack.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const s = vvScale();
    const raw = (e.clientY - drag.y0) * s;
    if (Math.abs(raw) > 6) drag.moved = true;
    const now = performance.now();
    drag.vy = ((e.clientY - drag.ly) * s) / Math.max(1, now - drag.lt);
    drag.ly = e.clientY; drag.lt = now;
    drag.dy = raw;
    const shown = raw < 0 ? raw : 56 * (1 - Math.exp(-raw / 110));
    stack.style.transform = `translateY(${shown}px)`;
  });
  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    holding = false;
    if (!cancelled && !d.moved && performance.now() - d.t0 < 600) {
      dismissAll("open");
    } else if (!cancelled && (d.dy < -40 || d.vy < -0.45)) {
      dismissAll("swipe");
    } else {
      const from = stack.style.transform;
      stack.style.transform = "";
      if (from) stack.animate([{ transform: from }, { transform: "translateY(0)" }], { duration: 480, easing: SPRING_SOFT });
      armTimer(2600);
    }
  }
  stack.addEventListener("pointerup", (e) => endDrag(e, false));
  stack.addEventListener("pointercancel", (e) => endDrag(e, true));
  stack.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") { holding = true; clearTimeout(stackTimer); } });
  stack.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !drag) { holding = false; armTimer(2600); } });
  stack.addEventListener("keydown", (e) => {
    if (!e.target.classList?.contains("platter")) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); dismissAll("open"); }
    else if (e.key === "Escape") { dismissAll("swipe"); }
  });

  // ════════════════════════════════════════════
  // 5. Auto schedule
  // ════════════════════════════════════════════
  let autoOn = true;
  let autoTimer = 0;
  let seq = 0;
  let lastItem = null;
  function nextItem() {
    if (seq < OPENING.length) return OPENING[seq++];
    let pick;
    do { pick = POOL[Math.floor(Math.random() * POOL.length)]; } while (pick === lastItem && POOL.length > 1);
    return pick;
  }
  function fire(item) {
    lastItem = item;
    notify(item);
  }
  function scheduleAuto(delay = rand(3200, 6400)) {
    clearTimeout(autoTimer);
    if (!autoOn || document.hidden) return;
    autoTimer = setTimeout(() => {
      const item = nextItem();
      fire(item);
      scheduleAuto(item.followUp ? rand(4600, 6800) : undefined);
    }, delay);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) clearTimeout(autoTimer);
    else scheduleAuto(rand(1200, 2400));
  });
  scheduleAuto(1600);

  // ════════════════════════════════════════════
  // 6. Hidden remote
  // ════════════════════════════════════════════
  const remote = $("remote");
  const remoteAudio = $("remote-audio");
  const TILES = [
    ["kakao", "카카오톡"], ["imessage", "메시지"], ["insta", "Instagram"], ["youtube", "YouTube"],
    ["toss", "토스"], ["emergency", "재난문자"], ["ios", "Apple"], ["heart", "❤️ 자기야"],
    ["burst", "5연발"],
  ];
  $("tiles").innerHTML = TILES.map(([k, label]) => {
    const icon = APPS[k] ? `<span class="app-icon">${APPS[k].icon}</span>`
      : `<span class="app-icon glyph">${k === "heart" ? "❤️" : "🔥"}</span>`;
    return `<button type="button" class="tile" data-fire="${k}">${icon}<span>${esc(label)}</span></button>`;
  }).join("");

  $("tiles").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-fire]");
    if (!btn) return;
    Sound.unlock();
    const k = btn.dataset.fire;
    if (k === "heart") return fire(HEART);
    if (k === "burst") {
      for (let i = 0; i < 5; i++) setTimeout(() => fire(nextItem()), i * 650);
      return;
    }
    const choices = POOL.filter((n) => n.app === k);
    fire(choices[Math.floor(Math.random() * choices.length)]);
  });

  function paintAudio() {
    remoteAudio.innerHTML = Sound.running()
      ? "소리 <b>켜짐</b> · 무음 모드에서도 울려요"
      : "소리 꺼짐 · 화면을 한 번 탭하면 켜져요";
  }
  Sound.onChange(paintAudio);

  function openRemote() {
    if (remote.open) return;
    paintAudio();
    remote.showModal();
    showLayer(); // keep banners above the sheet
  }
  $("remote-done").addEventListener("click", () => remote.close());
  remote.addEventListener("click", (e) => { if (e.target === remote) remote.close(); });
  $("auto-toggle").addEventListener("change", (e) => {
    autoOn = e.target.checked;
    if (autoOn) scheduleAuto(800); else clearTimeout(autoTimer);
  });
  $("sound-toggle").addEventListener("change", (e) => Sound.setEnabled(e.target.checked));

  // Triple-tap empty page area
  let taps = [];
  addEventListener("pointerup", (e) => {
    if (remote.open || stack.contains(e.target) || e.target === hapticLabel || hapticLabel.contains(e.target)) return;
    const now = performance.now();
    taps = taps.filter((t) => now - t < 700);
    taps.push(now);
    if (taps.length >= 3) { taps = []; openRemote(); }
  });
  const checkHash = () => { if (location.hash === "#ctl") openRemote(); };
  addEventListener("hashchange", checkHash);
  checkHash();

  // Debug hook (console): __notif.fire("kakao") / await __notif.analyse("kakao")
  window.__notif = {
    fire: (app) => fire(POOL.find((n) => n.app === app) || HEART),
    analyse: Sound.analyse,
    apps: Object.keys(RECIPES),
  };
})();
</script>
</body>
</html>
